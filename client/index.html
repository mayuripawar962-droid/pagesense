<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Page title shown in browser tab -->
    <title>PageSense — Multi-Source Research Assistant</title>

    <!-- Meta description for SEO -->
    <meta
      name="description"
      content="PageSense is an AI-powered research assistant that helps you understand, compare, and connect information from multiple sources."
    />

    <!-- Favicon placeholder — replace with your actual icon later -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <!--
      This single <div> is where React mounts the entire application.
      React will fill this div with all your components dynamically.
      You almost never need to edit this file.
    -->
    <div id="root"></div>

    <!--
      This script tag loads main.jsx — the React entry point.
      Vite handles bundling and serving this automatically.
    -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
